# TLS-only Redis. Every client -- delegates, the dispatcher, the control plane
# -- must present a client certificate signed by the POC CA; the certificate's
# CN then selects the ACL user (tls-auth-clients-user needs Redis >= 8.6).
port 0
tls-port 6379
tls-cert-file /certs/redis_server.crt
tls-key-file /certs/redis_server.key
tls-ca-cert-file /certs/ca.crt
tls-auth-clients yes
tls-auth-clients-user CN
tls-protocols "TLSv1.2 TLSv1.3"

# ACL users live in this file so they survive a restart (`ACL SAVE` writes it;
# the dispatcher also reconciles it against the delegate table at startup).
aclfile /data/users.acl

appendonly no
save ""
